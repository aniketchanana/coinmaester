x-email-volume: &email-volume ./ingested-emails:/app/ingested-emails

# Local development compose. App services use `build:` (requires repo source).
# To share with others (GHCR pull-only, no code): copy `.env` into `deploy-docker-app-assets/` and zip that folder.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finance -d finance_app']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: finance
      RABBITMQ_DEFAULT_PASS: finance
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api-backend:
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/api-backend/Dockerfile
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
      - docker/compose.env
    volumes:
      - *email-volume
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api-backend:3001
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api-backend:3001
    depends_on:
      api-backend:
        condition: service_healthy

  python-worker:
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/python-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
      - docker/compose.env
    volumes:
      - *email-volume
    depends_on:
      api-backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
