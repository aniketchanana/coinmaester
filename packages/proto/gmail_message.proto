syntax = "proto3";

package gmail;

service GmailMessageProcessing {
  rpc ClaimForProcessing(ClaimRequest) returns (ClaimResponse);
  rpc CompleteProcessing(CompleteRequest) returns (CompleteResponse);
}

message ClaimRequest {
  string gmail_message_id = 1;
}

message ClaimResponse {
  string id = 1;
  string header = 2;
  string status = 3;
  string email_body = 4;
  string user_id = 5;
}

message ExtractedTransaction {
  string bank_name = 1;
  double transaction_value = 2;
  string type = 3;
  string transaction_date = 4;
  string payment_made_to = 5;
  bool is_transaction_email = 6;
}

message CompleteRequest {
  string gmail_message_id = 1;
  ExtractedTransaction transaction = 2;
  string failure_reason = 3;
}

message CompleteResponse {
  string id = 1;
  string status = 2;
}
